name: Keep Dental Notes Alive

on:
  schedule:
    # Har 6 ghante me run hoga (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Dental Notes App
        run: |
          curl -I -s --max-time 15 "https://dental-notes.streamlit.app/" || true
